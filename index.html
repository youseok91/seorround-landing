<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102238" />
    <meta name="description" content="Seorround — discover stays, restaurants and local places in Seoul. Mobile app coming soon." />
    <title>Seorround — More than a Trip</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #102238; color: #fff; }
      .page { min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
      header, main, footer { width: min(100% - 48px, 1120px); margin-inline: auto; }
      header { padding-top: 30px; }
      .brand { font-family: Georgia, "Times New Roman", serif; font-size: 29px; font-style: italic; font-weight: 700; letter-spacing: -.05em; }
      main { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: 95px 110px; isolation: isolate; }
      main::before { content: ""; position: absolute; width: 560px; height: 560px; right: -120px; top: 50%; transform: translateY(-50%); border: 1px solid rgba(255,255,255,.15); border-radius: 50%; z-index: -1; box-shadow: 0 0 0 80px rgba(255,255,255,.025), 0 0 0 160px rgba(255,255,255,.018); }
      .eyebrow { color: #ff786b; font-size: 12px; font-weight: 700; letter-spacing: .24em; margin: 0 0 20px; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(64px, 10vw, 132px); line-height: .94; letter-spacing: -.065em; max-width: 760px; margin: 0; font-weight: 400; }
      h1 span { color: #ff786b; }
      .description { max-width: 520px; font-size: clamp(18px, 2.2vw, 23px); line-height: 1.55; color: #d9e2e9; margin: 34px 0 0; }
      .coming { margin-top: 42px; padding: 13px 19px; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; align-self: flex-start; font-size: 13px; letter-spacing: .02em; }
      footer { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-block: 22px 28px; border-top: 1px solid rgba(255,255,255,.18); color: #b9c7d2; font-size: 13px; }
      footer strong { color: #fff; font-weight: 600; }
      @media (max-width: 600px) { header, main, footer { width: min(100% - 40px, 1120px); } header { padding-top: 22px; } main { padding-block: 95px 85px; } main::before { width: 340px; height: 340px; right: -210px; opacity: .65; } .eyebrow { font-size: 10px; letter-spacing: .18em; } h1 { font-size: clamp(60px, 15vw, 86px); } .description { margin-top: 28px; } footer { align-items: flex-start; flex-direction: column; gap: 8px; } }
    </style>
  </head>
  <body>
    <div class="page">
      <header><div class="brand">Seorround</div></header>
      <main>
        <p class="eyebrow">STAY · EAT · EXPLORE SEOUL</p>
        <h1>More than<br />a <span>Trip.</span></h1>
        <p class="description">Discover stays, restaurants and local places in Seoul.</p>
        <div class="coming">Seorround mobile app — coming soon.</div>
      </main>
      <footer><strong>Contact / Support</strong><span>Support contact details will be available at launch.</span></footer>
    </div>
  </body>
</html>
